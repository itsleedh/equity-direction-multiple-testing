{
  "seed": 42,
  "universe": ["AAPL", "MSFT", "NVDA", "GOOGL", "AMZN"],
  "timeframes": ["1d"],
  "data": {
    "provider": "yfinance",
    "cache_dir": "../data/cache",
    "auto_adjust": true,
    "daily_years": 10,
    "hourly_period": "730d",
    "intraday_periods": {
      "1m": "7d",
      "5m": "60d",
      "15m": "60d"
    },
    "provider_rate_limit_seconds": 0,
    "weekly_resample_rule": "W-FRI",
    "offline": true
  },
  "target": {
    "mode": "binary",
    "horizon_bars": 1,
    "flat_band": {
      "method": "atr",
      "atr_period": 14,
      "fixed_bps": 5
    }
  },
  "execution": {
    "entry_lag_bars": 1,
    "round_trip_cost_bps": 5
  },
  "walk_forward": {
    "mode": "expanding",
    "initial_train_bars": 500,
    "test_bars": 126,
    "purge_lookback_bars": 200,
    "embargo_bars": 1,
    "min_train_bars": 60,
    "adaptive": true
  },
  "cross_sectional": {
    "enabled": true,
    "lookback_bars": 20,
    "top_n": 1,
    "bottom_n": 1
  },
  "reports": {
    "output_dir": "../reports/output_phase_e_cross_sectional"
  },
  "intraday_scalping": {
    "enabled": false,
    "provider": "yfinance",
    "timeframes": ["1m", "5m", "15m"],
    "timezone": "America/New_York",
    "regular_hours_only": true,
    "no_new_entries_after": "15:55",
    "force_flat_by": "16:00",
    "spread_cost_bps": 2,
    "slippage_bps": 3,
    "cost_sensitivity_bps": [0, 1, 2, 5]
  }
}
